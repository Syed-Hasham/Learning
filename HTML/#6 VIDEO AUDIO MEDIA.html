<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video, Audio & Media</title>
</head>
<body>
    <h1>VIDEO</h1>
    <video src="video.mp4" height="350" controls muted loop poster="image.jpg"></video>
    <br>
    <h1>AUDIO</h1>
    <audio src="audio.mp3" controls muted></audio>
    <br>
    <h1>SVG</h1>
    <svg height="100",widtt="100">
        <circle cx="50" cy="50" r="40" stroke="black" strok-width="3" fill="red"></circle>
    </svg>
    <br>
    <h1>IFRAME</h1>
    <iframe src="https://www.wikipedia.com/" frameborder="2" width="500" height="300" allowfullscreen></iframe>
    <br>
    <br>
    <h3>yt iframe taught by cwh</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=sgvxSGJSlwG7ywyV" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
