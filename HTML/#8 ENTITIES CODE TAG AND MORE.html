<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entities, Code tag and more</title>
    <link rel="icon" href="image.jpg">
</head>
<body>
    <h1>ENTITIES</h1>
    <p>
        &lt;  for <
        <br>
        &gt;  for >
        <br>
        &amp; for &
        <br>
        &nbsp; for a non-breaking space
        <br>
        &copy; for ©
    </p>
    <br>
    <h1>PRE TAG</h1>
    <pre>
        this is a paragraph
        >
        <
        &
        ©

        gave some line spaces
        G         A          P
    </pre>
    <br>
    <h1>BLOCKQUOTE TAG</h1>
    <blockquote cite="https://www.codewithharry.com/tutorial/quotation-tags/">
        Quotation text here.
    </blockquote>
</body>
</html>
<!--
HTML ENTITIES ARE USED TO REPRESENT SPECIAL CHARACTERS 
The <blockquote> and <q> tags serve to define quotations in HTML. While <blockquote> is used for longer, block-level quotes, <q> is used for shorter, inline quotes.
-->
