<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: blueviolet;
            height: 80vh;
            width: 30vw;
        }
        .box{
            width: 34px;
            height: 45px;
            background-color: yellow;
            /* animation: name duration timing-function delay iteration-count direction fill-mode play-state;animation: name duration timing-function delay iteration-count direction fill-mode play-state; */
            /* animation: animation;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-delay: 3s;
            animation-direction: alternate-reverse; */
            animation: animation2 1s linear 0s infinite;
        }
        @keyframes animation{
            from{
                background-color: red;
            }
            to{
                transform:translateX(171.2px) ;
            }
        }
        @keyframes animation2 {
            0%{
                transform: rotate(72deg);
            }
            20%{
                transform: rotate(144deg);
            }
            40%{
                transform: rotate(216deg);
            }
            60%{
                transform: rotate(288deg);
            }
            80%{
                transform: rotate(360deg);
            }
            100%{
                transform: rotate(0deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
