<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        h1{
            color: rgba(130, 157, 199, 0.651);
        }
        #CK{
            color: aqua;
        }
        #HCC{
            color: #daafaf;
        }
        #RGB{
            color: rgb(255, 0, 0);
        }
        #RGBA{
            color: rgba(88, 87, 167, 0.747);
        }
        #HSL{
            color: hsl(240, 27%, 85%);
        }
        ol{
            background-color: rgb(185, 39, 214);
        }
    </style>
</head>
<body>
    <h1>Lets Learn About COLORS</h1>
    <p>
        COLORS CAN BE REPRESENTED IN:
        <ol>
            <li id="CK">COLOR KEYWORD</li>
            <li id="HCC">HEX COLOR CODE</li>
            <li id="RGB">RGB</li>
            <li id="RGBA">RGBA</li>
            <li id="HSL">HSL</li>
        </ol>
    </p>
</body>
</html>
