<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS FILTERS</title>
    <style>
        img{
            filter: blur(3px) brightness(120%) contrast(220%) hue-rotate(90deg) drop-shadow(16px 16px 20px black) grayscale(0%) invert(0%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="img.jpg" alt="">
    </div>
</body>
</html>
