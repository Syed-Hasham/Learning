<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
        .box{
            width: 75px;
            border: 2px solid black;
            padding: 34px;
            margin: 0;
            box-shadow: 5px 15px 5px rgb(233, 99, 99);
            border-radius: 40px;
        }
        p{
            text-shadow: 1px 4px 2px rgb(241, 78, 78);
            outline: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box.
    </div>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Molestiae neque maiores recusandae minus odit deleniti velit vel! Ducimus maiores hic officia. Deleniti, officia?</p>
</body>
</html>
